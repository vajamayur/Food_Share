spring.application.name=api-gateway

server.port=8079

# ==========================
# EUREKA
# ==========================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ==========================
# AUTH SERVICE
# ==========================

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**


# ==========================
# FOOD SERVICE
# ==========================

spring.cloud.gateway.server.webmvc.routes[1].id=food-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://FOOD-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/foods/**

# ==========================
# REQUEST SERVICE
# ==========================

spring.cloud.gateway.server.webmvc.routes[2].id=request-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://REQUEST-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/requests/**

spring.cloud.gateway.server.webmvc.routes[4].id=delivery-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://REQUEST-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/deliveries/**

# ==========================
# PAYMENT SERVICE
# ==========================

spring.cloud.gateway.server.webmvc.routes[5].id=payment-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/payments/**

# ==========================
# USER SERVICE
# ==========================

spring.cloud.gateway.server.webmvc.routes[3].id=user-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/users/**
