<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title description">
  <title id="title">FoodShare Backend — current service and API flow</title>
  <desc id="description">Client requests go to the API Gateway which discovers Auth and Food services in Eureka. Each service uses its own MySQL database. User Service is direct because it is not configured in the gateway or Eureka.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#50657d"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#238a67"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172b4d" flood-opacity=".12"/></filter>
    <style>.box{stroke-width:2;rx:16;filter:url(#shadow)}.title{font:700 22px Arial,sans-serif;fill:#102a43}.sub{font:14px Arial,sans-serif;fill:#52677d}.label{font:600 14px Arial,sans-serif;fill:#31475e}.small{font:13px Arial,sans-serif;fill:#52677d}.tag{font:700 12px Arial,sans-serif;fill:#fff}.arrow{stroke:#50657d;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#238a67;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrowGreen)}</style>
  </defs>
  <rect width="1500" height="900" fill="#f6f9fc"/><rect width="1500" height="80" fill="#102a43"/>
  <text x="55" y="38" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">FoodShare Backend — Current Architecture &amp; Request Flow</text><text x="55" y="62" fill="#c7d7e8" font-family="Arial,sans-serif" font-size="14">Source configuration • solid = HTTP route/data access • dashed = Eureka registration/discovery</text>
  <rect class="box" x="55" y="175" width="205" height="125" fill="#e8f1ff" stroke="#4b83cc"/><text class="title" x="84" y="218">Web / API Client</text><text class="sub" x="84" y="246">Frontend, Postman, etc.</text><text class="sub" x="84" y="270">JSON + Bearer token</text>
  <rect class="box" x="370" y="150" width="255" height="175" fill="#fff4df" stroke="#d89725"/><text class="title" x="402" y="192">API Gateway</text><text class="sub" x="402" y="218">Spring Cloud Gateway MVC</text><text class="sub" x="402" y="246">Port 8079</text><rect x="402" y="267" width="91" height="25" rx="12" fill="#d89725"/><text class="tag" x="416" y="284">/api/auth/**</text><rect x="503" y="267" width="98" height="25" rx="12" fill="#d89725"/><text class="tag" x="514" y="284">/api/foods/**</text>
  <rect class="box" x="745" y="105" width="290" height="170" fill="#e8f8f3" stroke="#238a67"/><text class="title" x="777" y="147">Auth Service</text><text class="sub" x="777" y="173">Port 8084 • AUTH-SERVICE</text><text class="sub" x="777" y="202">Register / login; BCrypt password</text><text class="sub" x="777" y="226">JWT issue &amp; protected endpoints</text><rect x="777" y="239" width="177" height="23" rx="11" fill="#238a67"/><text class="tag" x="796" y="255">/api/auth/register · login</text>
  <rect class="box" x="745" y="355" width="290" height="170" fill="#edf2ff" stroke="#536dce"/><text class="title" x="777" y="397">Food Service</text><text class="sub" x="777" y="423">Port 8083 • FOOD-SERVICE</text><text class="sub" x="777" y="452">Food listing CRUD; status starts</text><text class="sub" x="777" y="476">as AVAILABLE</text><rect x="777" y="489" width="115" height="23" rx="11" fill="#536dce"/><text class="tag" x="796" y="505">/api/foods/**</text>
  <rect class="box" x="1130" y="120" width="255" height="140" fill="#fff" stroke="#7f8c9a"/><text class="title" x="1162" y="162">Auth MySQL</text><text class="sub" x="1162" y="189">foodshare_auth_db</text><text class="sub" x="1162" y="215">users table</text>
  <rect class="box" x="1130" y="380" width="255" height="140" fill="#fff" stroke="#7f8c9a"/><text class="title" x="1162" y="422">Food MySQL</text><text class="sub" x="1162" y="449">foodshare_food_db</text><text class="sub" x="1162" y="475">foods table</text>
  <rect class="box" x="400" y="590" width="270" height="155" fill="#eef8ff" stroke="#2d87b8"/><text class="title" x="432" y="632">Service Registry</text><text class="sub" x="432" y="658">Eureka Server • Port 8761</text><text class="sub" x="432" y="686">Service registration &amp; lookup</text><text class="sub" x="432" y="710">Dashboard: /</text>
  <rect class="box" x="745" y="625" width="290" height="170" fill="#fff0f4" stroke="#c54b78"/><text class="title" x="777" y="667">User Service</text><text class="sub" x="777" y="693">Port 8082 • direct access only</text><text class="sub" x="777" y="722">User CRUD and plain-password</text><text class="sub" x="777" y="746">login (as currently coded)</text><rect x="777" y="759" width="122" height="23" rx="11" fill="#c54b78"/><text class="tag" x="797" y="775">/api/users/**</text>
  <rect class="box" x="1130" y="640" width="255" height="140" fill="#fff" stroke="#7f8c9a"/><text class="title" x="1162" y="682">User MySQL</text><text class="sub" x="1162" y="709">foodshare_user_db</text><text class="sub" x="1162" y="735">users table</text>
  <path class="arrow" d="M260 237 H370"/><text class="label" x="286" y="222">Gateway APIs</text><path class="arrow" d="M625 202 H745"/><text class="label" x="648" y="187">auth route</text><path class="arrow" d="M625 280 C690 280 692 440 745 440"/><text class="label" x="643" y="331">food route</text><path class="arrow" d="M1035 190 H1130"/><path class="arrow" d="M1035 440 H1130"/><path class="arrow" d="M1035 710 H1130"/><path class="arrow" d="M210 300 C210 665 585 705 745 705"/><text class="label" x="230" y="520">Direct User API: localhost:8082</text>
  <path class="dash" d="M510 590 C510 510 710 325 800 275"/><path class="dash" d="M640 590 C670 540 760 525 815 525"/><path class="dash" d="M510 590 C500 475 485 405 495 325"/><text class="small" x="560" y="565">register / discover</text>
  <rect x="55" y="830" width="1330" height="38" rx="10" fill="#e9eef5"/><circle cx="88" cy="849" r="6" fill="#50657d"/><text class="small" x="103" y="854">HTTP request / data access</text><line x1="294" y1="849" x2="337" y2="849" stroke="#238a67" stroke-width="2" stroke-dasharray="6 5"/><text class="small" x="348" y="854">Eureka registration/discovery</text><text class="small" x="750" y="854">User Service has no gateway route or Eureka client properties.</text>
</svg>
